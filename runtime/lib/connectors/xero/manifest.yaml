key: xero
name: Xero
kinds: [oauth]
credential_exposure: broker
# Script connector: every accounting call needs the `Xero-tenant-id` header (raw lib.api get cannot
# send headers), the tenant is resolved from GET /connections, and each list endpoint wraps its rows
# under its own key (Invoices, Contacts, ...). OAuth only: Xero has no customer-mintable API key.
connector_module: lib.connectors.xero
env_var: RC_CONN_XERO
egress_hosts:
  - api.xero.com
  - identity.xero.com    # OAuth token refresh endpoint
# --- Generic lib.api caller fields (the compact declarative row) ---
base_url: https://api.xero.com/api.xro/2.0
auth:
  strategy: bearer        # OAuth2 access token, injected from the oauth row's fresh bearer
default_headers:
  Accept: application/json  # Xero answers XML without it
pagination:
  # 1-based page numbers (page=1,2,...), no has-more flag: stop on a short page. Invoices/Contacts honour
  # pageSize (default 100, max 1000). items_field is empty because every endpoint uses its own key; the
  # script's _xero_pages sets it per call, so generic --paginate collapses to one page.
  style: page
  page_param: page
  page_start: 1
  items_field: ""
  page_size: 100
rate_limit:
  remaining_header: X-MinLimit-Remaining   # advisory; Xero also sends 429 + Retry-After
oauth:
  auth_url: https://login.xero.com/identity/connect/authorize
  token_url: https://identity.xero.com/connect/token
  default_scopes:
    - openid
    - profile
    - email
    - offline_access
    - accounting.invoices.read
    - accounting.payments.read
    - accounting.banktransactions.read
    - accounting.contacts.read
    - accounting.settings.read
help_md: |
  Reads Xero invoices, payments and contacts for the connected organisation, so you can tell a
  customer whether an invoice is paid, what is still open, and send them the invoice link. Read-only.
  AUTHORISED = approved and unpaid, PAID = settled; `AmountDue` is what is still open.

  Find the customer by the sender's email (contact + open and recently paid invoices), by company
  name, or the invoice by the number they quote (payments, credit notes, due and paid dates);
  `--online-url` adds the link the customer can view and pay from:

      python -m lib.connectors.xero contact --email billing@acme.example
      python -m lib.connectors.xero contact "Acme"
      python -m lib.connectors.xero invoice INV-0042
      python -m lib.connectors.xero invoice INV-0042 --online-url

  Xero matches only a contact's main email: when `--email` finds nothing, try the company name from the
  signature or domain, then the invoice number. Cross-check that the invoice's contact is the sender.

  Anything else: `get <path>` adds the organisation header for you (plain `lib.api get xero` cannot,
  so it fails). Paths sit under the accounting API; `--query` takes Xero's `where`, `order`,
  `Statuses`, `searchTerm`; `--max-pages N` collects a list; `--pick` keeps a few fields per row:

      python -m lib.connectors.xero invoices --contact-id <ContactID> --status AUTHORISED,PAID
      python -m lib.connectors.xero get CreditNotes --query 'where=Contact.ContactID==Guid("<ContactID>")' --pick CreditNoteNumber,Status,RemainingCredit
      python -m lib.connectors.xero get Payments --query 'where=Date>=DateTime(2026,11,01)' --query 'order=Date DESC'
      python -m lib.connectors.xero get Overpayments --query 'where=Contact.ContactID==Guid("<ContactID>")'

  Other useful paths: Prepayments, BankTransactions, Organisation, Accounts, Currencies. Dates come as
  `/Date(ms+0000)/` in raw `get` output. Write a small `/tmp` script when one call isn't enough.

  Organisations: commands pick the organisation automatically when the connection covers one. With
  several they stop and list them; pass `--org "<name>"` or `--tenant-id <id>` (`tenants` lists them).

  Disconnecting Xero in ReplyPen does not remove ReplyPen from Xero; the customer does that under
  Xero → Settings → Connected apps. An error saying the connection was rejected means a project admin
  must reconnect Xero in ReplyPen.
onboarding_md: |
  Ask which invoice or payment questions customers write in about — an outstanding or missing
  invoice, a payment not applied, or a credit note. Explore contacts, invoices, and payments without
  keeping customer rows; capture how a sender email or name maps to a Xero contact and then to that
  contact's invoices, credit notes, and payments, plus the status values that mean outstanding or
  paid. When the connection covers several organisations, record which one serves which mailbox or
  brand. Sending or voiding an invoice, recording a payment, or creating a contact is a write
  requiring a live action or an explicit manual step; this connector only reads.
