key: dentai_booking_preview
name: DentAI booking preview
kinds: [token]
connector_module: ""
env_var: RC_CONN_DENTAI_BOOKING_PREVIEW
credential_exposure: broker
tenant_required: true
egress_hosts:
  - app.dentai.be
base_url: https://app.dentai.be
auth:
  strategy: bearer
pagination:
  style: none
read_endpoints:
  post:
    - /internal/booking/slots
    - /internal/booking/book
    - /internal/booking/refresh-patient
    - /internal/booking/reschedule-link
    - /internal/booking/series-context
help_md: |
  Tenant-bound read plane of DentAI's single availability/booking engine: slot search, dry-run
  booking verdicts, and the patient-appointment cache read-through (`refresh-patient`: re-mirror one
  patient of THIS tenant from ClickDoc), and minting a patient's personal reschedule link
  (`reschedule-link`: DentAI stores a server-bound request, nothing in the PMS changes), and reading
  a patient's treatment-series context (`series-context`: masked appointment notes, labels and the
  practice's series templates; read-only, served only when the tenant switch `treatment_series_enabled` is on). The raw token stays in ReplyPen's broker; ordinary runs only
  see the broker route. The project-brain wrapper is `skills/scheduling/scripts/search_availability.py`.
  DentAI enforces the token scope server-side: this credential can search, dry-run and refresh the
  cache, never mutate PMS appointments.
onboarding_md: |
  Ask can the DentAI operator mint the booking preview credential for this tenant now.
  Mint it with `TENANT=<slug> make agenda-tokens` in dentai; store the minted preview value on this
  tenant, never at project scope.
  It can search availability and dry-run bookings but cannot write them.
