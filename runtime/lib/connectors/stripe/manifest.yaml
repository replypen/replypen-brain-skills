key: stripe
name: Stripe
kinds: [token]
connector_module: lib.connectors.stripe
env_var: RC_CONN_STRIPE
credential_exposure: broker
egress_hosts:
  - api.stripe.com
# Generic lib.api caller fields (the compact declarative row). A connector exists here only because
# Stripe trips the force-code triggers: multi-call join + field pre-selection.
base_url: https://api.stripe.com/v1
auth:
  strategy: bearer        # bearer | basic | api_key_header | query_param | oauth2_client_credentials
pagination:
  style: cursor           # none | cursor | offset | link
  cursor_param: starting_after
  has_more_field: has_more
  items_field: data
  page_size: 100
rate_limit:
  # Stripe paces with 429 + Retry-After (honoured by lib.api), not a remaining-count header.
  remaining_header: ""
read_endpoints:
  post:
    # Creates an unsaved invoice preview; Stripe does not persist, list, edit, or collect it.
    - /invoices/create_preview
    - /v1/invoices/create_preview
# Principal-scoped HTTP egress ("RLS for APIs"): the ReplyPen-owned rule-set that, on a principal-asserted
# run whose project binds `stripe_customer_id`, limits Stripe reads to that one customer's objects. Absent a
# bound principal it is inert (unscoped-as-today). The three modes cover the BOLA shapes: self (id IS the
# owner), inject (list filtered by a provider-honoured param), preflight (owner learnable only from the body).
scope:
  owner_claim: stripe_customer_id
  endpoints:
    - match: GET /v1/customers/{id}
      mode: self
    - match: GET /v1/invoices
      mode: inject
      param: customer
      allowed_params:
        - status
        - limit
        - starting_after
        - "created[gte]"
        - "created[lte]"
    - match: GET /v1/invoices/{id}
      mode: preflight
      owner_path: customer
    - match: GET /v1/charges/{id}
      mode: preflight
      owner_path: customer
help_md: |
  Reads Stripe customers/subscriptions/invoices/charges for billing-support diagnosis. Use a
  RESTRICTED read-only key (rk_…), test mode for validation. The connector renders a concise
  per-customer support summary (subscription status, plan, latest invoice, last failed payment).

  Non-mutating POST preview:

      python -m lib.api post stripe /invoices/create_preview \
        --form customer=cus_123 --form subscription=sub_123 \
        --pick id,amount_due,currency,lines.data.*.description,lines.data.*.amount
onboarding_md: |
  Ask which billing-support cases matter (failed payments, invoice questions, subscription state,
  refunds) and whether the connected account is test or live mode. Explore representative object shapes
  without retaining customer rows; capture the lookup sequence, stable account/product/price IDs when
  genuinely reusable, relevant statuses, and how email/customer IDs map to subscriptions, invoices, and
  charges. Any refund, cancellation, retry, or subscription change is a write and must reference a live
  action or remain an explicit manual step.
