key: shopify
name: Shopify
kinds: [token, oauth]
credential_exposure: broker
# GraphQL transport (POST) + deeply nested edges/nodes requiring field pre-selection trigger a script
# connector. lib.api is GET/REST-only; a script wraps GraphQL POSTs using requests directly but still
# delegates retry/backoff to lib.api where possible.
connector_module: lib.connectors.shopify
# The injected credential is the Admin API access token (offline/online OAuth token or a private-app
# token). A per-shop token has no fixed prefix (unlike Stripe rk_/sk_).
env_var: RC_CONN_SHOPIFY
egress_hosts:
  - "*.myshopify.com"   # per-shop subdomain; the agent supplies the shop slug via --shop
# --- Generic lib.api caller fields ---
# base_url has no fixed value: Shopify is per-shop (https://<shop>.myshopify.com/…). The connector
# builds it from the --shop arg. The generic `python -m lib.api get shopify …` CLI is NOT usable for
# GraphQL, so base_url is intentionally left as a placeholder that signals "use the connector CLI".
base_url: "https://{shop}.myshopify.com/admin/api/2026-07/graphql.json"
auth:
  # X-Shopify-Access-Token header — lib.api's api_key_header strategy places the raw credential
  # (no "Bearer" prefix) in the named header.
  strategy: api_key_header
  name: X-Shopify-Access-Token
pagination:
  # GraphQL cursor pagination is embedded in the query body (`after` arg / pageInfo.endCursor) — the
  # generic lib.api paginator can't drive it. The connector script handles pagination internally.
  style: none
  page_size: 50
rate_limit:
  # Shopify uses a query-cost throttle (extensions.cost in the response body), not a remaining-count
  # response header. 429 + Retry-After is still possible; lib.api handles that.
  remaining_header: ""
read_endpoints:
  post:
    - graphql.json
    - /admin/api/*/graphql.json
oauth:
  # Per-shop OAuth: the {shop} placeholder is filled by the connect flow. Shopify uses the
  # authorization_code grant with per-shop auth/token URLs; the connect flow substitutes the slug.
  auth_url: https://{shop}.myshopify.com/admin/oauth/authorize
  token_url: https://{shop}.myshopify.com/admin/oauth/access_token
  default_scopes:
    - read_orders
    - read_customers
    - read_products
    - read_inventory
help_md: |
  Reads Shopify orders (status, tracking, refunds, returns), customers, products, and inventory via
  the Admin GraphQL API for support diagnosis. Read-only by declared scopes; the access token stays
  host-side and is used through the API broker.

  Shopify's Admin API is GraphQL (POST), so use the connector script, not the generic lib.api CLI:

      python -m lib.connectors.shopify --shop mystore order --name "#1001"
      python -m lib.connectors.shopify --shop mystore orders --query "email:cus@example.com" --limit 10
      python -m lib.connectors.shopify --shop mystore customer --ref cus@example.com
      python -m lib.connectors.shopify --shop mystore product --id gid://shopify/Product/123456

  --shop is the store's myshopify subdomain (e.g. "mystore" for mystore.myshopify.com), not its
  branded domain. --query takes Shopify's order search syntax (name, email, financial_status,
  created_at, ...); `orders --limit N` pages 25 at a time up to N (default 50).

  Refunds: `orders` shows only the refunded total; `order --name` lists each refund record with
  its refund transactions, one line each: amount, where it went (the customer's payment method, store
  credit, a manual gateway, or a test), status and date. A refund record alone does not prove money
  moved, and its total can leave out pending attempts: answer from the transaction lines. SUCCESS to
  the payment method means processed; banks usually take several business days to show it.
  PENDING or AWAITING_RESPONSE means the provider is still working on it; FAILURE or ERROR means that
  attempt did not go through. Amounts are in the buyer's currency (the shop currency follows when it
  differs). Compare the order email with the sender before quoting anything.

  Orders older than 60 days are only visible if the store granted read_all_orders; an empty result
  for an older order number means "not visible", not "does not exist".
onboarding_md: |
  Ask which order questions customers email about (where is my order, did it ship, tracking,
  refund or return status). Explore representative order and customer shapes without retaining
  rows; capture how a sender email maps to a customer and its orders, the order-name format
  (e.g. #1001), the order gid, the fulfillment and financial status enums that matter, and how the
  shop records refunds (partial vs full, which gateways, how long a PENDING refund usually takes). Orders
  older than 60 days need the read_all_orders scope, so note if older lookups
  fail. Refunding, cancelling, editing, or fulfilling an order is a write and must reference a live
  action or remain an explicit manual step.
