key: quickbooks
name: QuickBooks Online
kinds: [oauth]
credential_exposure: broker
# Script connector: lib.connectors.quickbooks exists because force-code triggers fire:
# (a) field pre-selection — Customer/Invoice objects carry 50+ fields; support needs 5–8.
# (d) non-standard pagination — QB embeds STARTPOSITION/MAXRESULTS *inside* the SQL query string.
# (e) search DSL — QB's SQL-like query language; pre-built queries prevent footguns.
# OAuth only: QBO has no customer-mintable API key and access tokens expire hourly.
connector_module: lib.connectors.quickbooks
env_var: RC_CONN_QUICKBOOKS
egress_hosts:
  - quickbooks.api.intuit.com          # production companies (production keys)
  - sandbox-quickbooks.api.intuit.com  # sandbox companies (development keys)

# One connection = one company. The host stores realm_id (Intuit's callback realmId) and api_host (the
# host the token answered on at connect) in the connection config and resolves both placeholders on the
# broker route; api_host must be one of egress_hosts above.
base_url: https://{api_host}/v3/company/{realm_id}
auth:
  strategy: bearer
pagination:
  style: none             # the connector pages inside the SQL itself
  items_field: ""
  page_size: 100
default_headers:
  Accept: application/json     # QB serves XML without it
rate_limit:
  # 500 req/min and 10 req/s per company; throttling is 429 (errorCode 003001), no remaining header.
  remaining_header: ""
oauth:
  auth_url: https://appcenter.intuit.com/connect/oauth2
  token_url: https://oauth.platform.intuit.com/oauth2/v1/tokens/bearer
  # Intuit has no read-only scope: accounting is read+write. Read-only is enforced by the broker (GET
  # only) and this connector. No OIDC scopes: identity is the company (realmId), not the signing-in user.
  default_scopes:
    - com.intuit.quickbooks.accounting
help_md: |
  Reads QuickBooks Online customers, invoices and payments of the one connected company.
  Answers "did you get my payment", "can you resend invoice 1037", "what do I still owe". Read-only.
  Billing contacts often differ from the person writing in, so if the sender's email finds nothing,
  search by name or by the invoice number they quote. Balance 0 on an invoice means paid.

  Start with the customer or the invoice:

      python -m lib.connectors.quickbooks customer --email jane@acme.com
      python -m lib.connectors.quickbooks customer "Acme"
      python -m lib.connectors.quickbooks invoice --number 1037

  Then follow the customer Id from the output:

      python -m lib.connectors.quickbooks invoices --customer-id 42 --open
      python -m lib.connectors.quickbooks payments --customer-id 42
      python -m lib.connectors.quickbooks invoice 1001        # by QuickBooks Id
      python -m lib.connectors.quickbooks company

  Anything else: QuickBooks SQL through the query endpoint (paths are relative to the company),
  e.g. credit memos for a customer:

      python -m lib.api get quickbooks query \
        --query "query=SELECT * FROM CreditMemo WHERE CustomerRef = '42' MAXRESULTS 20" \
        --query minorversion=75 --pick "QueryResponse.CreditMemo.*.DocNumber,QueryResponse.CreditMemo.*.TotalAmt"

  SQL notes: always `SELECT *` (narrow with `--pick`), single-quote string values,
  `LIKE '%term%'` for partial matches, page with `STARTPOSITION 1 MAXRESULTS 100` at the end.
  Entities: Customer, Invoice, Payment, CreditMemo, Estimate, Item, Vendor, Bill, CompanyInfo. For
  several lookups in a row, write a small /tmp script that imports `lib.connectors.quickbooks`.
onboarding_md: |
  Ask which invoice or payment questions customers write in about — an unpaid or missing invoice, a
  payment not showing, or a credit note. Explore representative customers, invoices, and payments
  without keeping customer rows; capture how a sender email or name maps to a QuickBooks customer and
  then to that customer's invoices and payments (and how often the billing contact differs from the
  sender), plus the invoice-number format customers quote and which fields mean paid or overdue.
  Sending or voiding an invoice, recording a payment, or creating a customer is a write requiring a
  live action or an explicit manual step; this connector only reads.
