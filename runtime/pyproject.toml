# replypen-runtime — the `lib` helpers a brain's grounding scripts import (`from lib import db`).
#
# ONE canonical source of truth, consumed by BOTH ends by the same pin:
#   - prod:  replypen/runtime/Dockerfile installs `replypen-runtime @ git+…@vX.Y.Z`
#            (subdirectory=runtime) instead of `COPY runtime/lib`.
#   - local: the kit's uv-mode runners + a brain's own scripts resolve the same `lib`.
# Because both install identical versioned bytes, "tested locally" provably equals "runs in prod".
#
# Pin by tag, never float `main` — a push would silently break clients' green local tests.
#   uv add "replypen-runtime @ git+https://github.com/replypen/replypen-brain-skills@v0.14.13#subdirectory=runtime"
[project]
name = "replypen-runtime"
version = "0.14.13"
description = "Read-only grounding helpers (db, stripe, cloudwatch, fs, http, html, livecheck) that a ReplyPen brain's scripts import."
requires-python = ">=3.11"

# Same pins the workspace image bakes (replypen/runtime/Dockerfile). Kept in lockstep with the
# image tag so a uv-mode install and the docker-mode image carry the same dependency surface.
dependencies = [
    "psycopg[binary]==3.2.3",
    # MySQL grounding (lib.db mysql:// branch). Pure Python, text protocol only — the wire
    # proxy in front of a customer MySQL refuses prepared statements.
    "pymysql==1.1.2",
    "stripe==11.4.1",
    "boto3==1.35.92",
    "requests>=2.32.3,<3",
    "markdownify==1.2.2",
    "posthog==7.19.2",
    "pyyaml==6.0.3",
    # File-format surface for the cross-project /skills (xlsx/csv/pdf). Wheel-only by design —
    # python:3.12-slim carries no compiler, so anything needing a source build is out.
    "openpyxl==3.1.5",
    "pandas==3.0.5",
    "pypdf>=6.14.2,<7",
    "pdfplumber==0.11.10",
    "fpdf2==2.8.7",
    # pandas' optional backend for DataFrame.to_markdown(); without it the call raises ImportError.
    "tabulate==0.10.0",
]

[project.optional-dependencies]
# Pulled in by the kit's brain_test.py runner; the livecheck pytest plugin lives in lib/.
# `responses` mocks requests at the transport layer for lib.api unit tests (no network); `vcrpy`
# records/replays HTTP cassettes for the Stripe connector with secrets scrubbed at record time.
test = ["pytest>=8", "responses>=0.25", "vcrpy>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ship the `lib` package as-is (db.py, fs.py, livecheck.py, …). The import name stays `lib` so brain
# scripts and the prod container agree: `from lib import db`.
packages = ["lib"]
artifacts = ["lib/**/*.yaml", "lib/contracts/*"]
